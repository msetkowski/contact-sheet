name: Release

# Pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`)
# builds the binaries for all platforms and publishes a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  BIN: contact-sheet
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Statically linked musl binaries: run on any Linux distribution,
          # regardless of its glibc version.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          # Native ARM runner, so the tests run on the target architecture.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel Macs: cross-compiled on the Apple silicon runner, where the
          # x86_64 test binary cannot run natively, so tests are skipped.
          - os: macos-latest
            target: x86_64-apple-darwin
            skip-tests: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the Cargo.toml version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Fails the release when dependencies changed but the licence notices
      # shipped in the archives were not regenerated.
      - name: Check third-party licence notices
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: ruby scripts/third-party-licenses.rb --check

      - name: Run tests
        if: ${{ !matrix.skip-tests }}
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="${BIN}-${GITHUB_REF_NAME}-${{ matrix.target }}"
          exe="${BIN}"
          [[ "${{ runner.os }}" == "Windows" ]] && exe="${BIN}.exe"

          # The licences of the embedded DejaVu font and of the crates built
          # into the binary must accompany it.
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/${exe}" README.md LICENSE "dist/${name}/"
          cp assets/LICENSE-DejaVu.txt THIRD-PARTY-LICENSES.txt "dist/${name}/"

          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            asset="${name}.zip"
            7z a -tzip "${asset}" "${name}" > /dev/null
            sha256sum "${asset}" > "${asset}.sha256"
          else
            asset="${name}.tar.gz"
            tar -czf "${asset}" "${name}"
            shasum -a 256 "${asset}" > "${asset}.sha256"
          fi
          echo "ASSET=dist/${asset}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

  # A single job creates the release once every build has succeeded, so
  # parallel jobs do not race to create it and no half-finished release is
  # published when one platform fails.
  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  # Runs after the GitHub release, so the archives `cargo binstall` downloads
  # exist by the time the version appears on crates.io. Authenticates with
  # crates.io Trusted Publishing (GitHub OIDC) – no API token is stored.
  crates-io:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Points the formula in the Homebrew tap at the new release archives.
  # Pushes with a deploy key that can write to the tap repository only; its
  # private half is the HOMEBREW_TAP_DEPLOY_KEY secret of this repository.
  homebrew:
    name: Update Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the tap deploy key
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [[ -z "${DEPLOY_KEY}" ]]; then
            echo "::error::Secret HOMEBREW_TAP_DEPLOY_KEY is not set, so the formula in msetkowski/homebrew-tap cannot be updated"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Download the release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern '*.sha256' --dir checksums

      - uses: actions/checkout@v7
        with:
          repository: msetkowski/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - name: Update the formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          ruby scripts/homebrew-formula.rb "${version}" checksums > homebrew-tap/Formula/contact-sheet.rb
          cd homebrew-tap
          git add Formula/contact-sheet.rb
          if git diff --cached --quiet; then
            echo "The formula is already up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "contact-sheet ${version}"
          git push
