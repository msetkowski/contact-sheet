[package]
name = "contact-sheet"
version = "0.6.1"
edition = "2024"
rust-version = "1.89"
description = "Create A4, A3 or Letter contact sheets (JPEG or PDF/X-4) from Canon, Nikon, Fujifilm and Hasselblad RAW, DNG, TIFF and JPEG photos"
license = "Apache-2.0"
repository = "https://github.com/msetkowski/contact-sheet"
exclude = ["docs/", ".github/", ".gitignore", "scripts/"]
readme = "README.md"
keywords = ["photography", "contact-sheet", "raw", "thumbnails", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

# `cargo binstall contact-sheet` downloads the prebuilt binary from the GitHub
# release instead of compiling. The archives are built by .github/workflows/release.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "tiff", "png"] }
imageproc = "0.27.0"
miniz_oxide = "0.9.1"
pdf-writer = "0.15.0"
rawler = "0.8.0"
rayon = "1.12.0"
