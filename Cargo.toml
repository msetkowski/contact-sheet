[package]
name = "contact-sheet"
version = "0.3.1"
edition = "2024"
description = "Create A4 contact sheets from Canon, Nikon, Fujifilm and Hasselblad RAW, DNG, TIFF and JPEG photos"
license = "Apache-2.0"
repository = "https://github.com/msetkowski/contact-sheet"
exclude = ["docs/"]
readme = "README.md"
keywords = ["photography", "contact-sheet", "raw", "thumbnails", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "tiff", "png"] }
imageproc = "0.27.0"
rawler = "0.8.0"
rayon = "1.12.0"
